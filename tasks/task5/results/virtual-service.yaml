apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: booking-service-feature-flag
spec:
  hosts:
    - booking-service
  http:
    - match:
        - headers:
            X-Feature-Enabled:
              exact: "true"
      route:
        - destination:
            host: booking-service
            subset: v2
          weight: 100
          headers:
            response:
              set:
                X-Service-Version: "v2 via header"
    - route:
        - destination:
            host: booking-service
            subset: v1
          weight: 90
          headers:
            response:
              set:
                X-Service-Version: "v1 canary"
        - destination:
            host: booking-service
            subset: v2
          weight: 10
          headers:
            response:
              set:
                X-Service-Version: "v2 canary"