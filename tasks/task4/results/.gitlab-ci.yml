stages:
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service

build:
  stage: build
  image: docker:latest
  script:
    - docker build -t ${IMAGE_NAME}:latest ../booking-service


test:
  stage: test
  image: docker:latest
  needs: ["build"]
  script:
    - docker run -d --name ${IMAGE_NAME} -p 8080:8080 ${IMAGE_NAME}:${IMAGE_TAG}

    # Ожидание готовности сервиса с таймаутом
    - apk add --no-cache curl
    - |
      echo "Waiting for service to be ready..."
      for i in {1..10}; do
        if curl -f http://localhost:8080/ping >/dev/null 2>&1; then
          echo "ready!"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "Service failed to start within 30 seconds"
          exit 1
        fi
        sleep 1
      done

    # Основная проверка
    - curl -f http://localhost:8080/ping
    - echo "Health check passed successfully"

  after_script:
    - docker rm -f ${IMAGE_NAME} || true


deploy:
  stage: deploy
  image: alpine:latest
  needs: ["test"]
  before_script:
    - apk add --no-cache docker curl
  script:
    - minikube image load ${IMAGE_NAME}:${IMAGE_TAG}
    - |
      if [ -d "${HELM_CHART_PATH}" ]; then
        echo "Upgrading Helm release..."
        helm upgrade ${IMAGE_NAME} ../helm/booking-service \
          --install \
          --set image.tag=${IMAGE_TAG} \
          --set image.repository=${IMAGE_NAME} \

 